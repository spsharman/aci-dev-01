      contracts:
        - name: inter-esg-non-stateful
          description: inter-esg contract
          scope: tenant
          subjects:
            - name: tcp
              description: allows outbound tcp from consumer to provider
              filters:
                - filter: tcp-src-any-dst-22
            - name: icmp
              description: allows outbound icmp from consumer to provider
