          description: configured with NAC
          alias: internal-vrf
          leaked_internal_subnets:
            - prefix: 10.237.99.160/28
              public: true
              destinations:
                - tenant: shared-services
                  vrf: vrf-01
            - prefix: 10.237.99.176/28
              public: true
              destinations:
                - tenant: shared-services
                  vrf: vrf-01
            - prefix: 10.5.32.0/24
              public: false
              destinations:
                - tenant: shared-services
                  vrf: vrf-01
