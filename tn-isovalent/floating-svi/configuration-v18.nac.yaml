# Notes:
# Tenant isovalent
#
# Description: Build v18 from v17.
# Tenant-scope permit-to-network-segments-10.100.{7,8,9}.0_24; jumphost ESG consumes all three.
#
# Outstanding:
# - Security domain for shared-services
---
apic:

# Tenants: Location in GUI: `Tenants`
  tenants:
# The shared-services tenant is unmanaged; the following contracts are exported
    # - name: shared-services
    #   managed: false
    #   imported_contracts:
    #     - name: permit-to-tn-isovalent-egress-subnet
    #       tenant: isovalent
    #       contract: permit-to-egress-subnet

    #     - name: permit-to-tn-isovalent-ingress-subnet-cluster-1
    #       tenant: isovalent
    #       contract: permit-to-ingress-subnet-cluster-1

    #     - name: permit-to-tn-isovalent-ingress-subnet-cluster-2
    #       tenant: isovalent
    #       contract: permit-to-ingress-subnet-cluster-2

    #     - name: permit-to-tn-isovalent-node-subnet
    #       tenant: isovalent
    #       contract: permit-to-node-subnet

# The isovalent tenant is managed
    - name: isovalent
      description: 10.237.101.0/26 and 10.237.101.144/28
      security_domains:
        - isovalent

# Policies: Location in GUI: `Tenants` » `XXX` » `Policies`
      policies:

# BGP Address Family Context Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `BGP` » `BGP Address Family Context`
        bgp_address_family_context_policies:
          - name: cilium-cni-bgp-af-context
            description: BGP weights and paths policies for cilium cni
            ebgp_distance: 20
            ibgp_distance: 200
            local_distance: 220
            ebgp_max_ecmp: 64
            ibgp_max_ecmp: 64
            local_max_ecmp: 4
            enable_host_route_leak: false

# BGP Best Path Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `BGP` » `BGP Best Path Policy`
        bgp_best_path_policies:
          - name: cilium-cni-bgp-as-path
            description: BGP best path policy for cilium cni
            as_path_multipath_relax: true
            ignore_igp_metric: true

# BGP Peer Prefix Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `BGP` » `BGP Peer Prefix`
        bgp_peer_prefix_policies:
          - name: cilium-cni-bgp-prefix-policy
            description: BGP prefix policies for cilium cni
            action: 'reject'
            threshold: 75
            max_prefixes: 500

          - name: smart-switch-bgp-prefix-policy
            description: BGP prefix policy for Smart Switch iBGP
            action: 'reject'
            threshold: 75
            max_prefixes: 100

# BGP Timer Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `BGP` » `BGP Timers`
        bgp_timer_policies:
          - name: cilium-cni-bgp-timers
            description: BGP timer policies for cilium cni
            keepalive_interval: 1
            hold_interval: 3
            stale_interval: 6
            graceful_restart_helper: true
            maximum_as_limit: 1

          - name: core-bgp-timers
            description: BGP timer policies for core network peering
            keepalive_interval: 60
            hold_interval: 180
            stale_interval: 300
            graceful_restart_helper: true
            maximum_as_limit: 10

# DHCP Relay Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `DHCP` » `Relay Policies`
        dhcp_relay_policies:
          - name: dhcp.uktme.cisco.com
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-bm-pod-1
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-bm-pod-2
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-vm-hx-dev-01-fi-a-pod-1
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-vm-hx-dev-01-fi-b-pod-1
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                # l3out: shared-services.vrf-01-ospf-area-0.0.0.1
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

# IP SLA Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `IP SLA` » `IP SLA Monitoring Policies`
        ip_sla_policies:
          - name: icmp-aggressive-timers
            description: This policy sends a icmp ping every 1 second
            frequency: 1
            multiplier: 3
            sla_type: icmp

# Match Rule: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `Match Rules`
        match_rules:
          - name: pod-subnets
            description: match all pod subnets
            prefixes:
              - ip: 0.0.0.0/0
                aggregate: true
                to_length: 0

          - name: match-all-subnets
            description: exact match for default route 0.0.0.0/0
            prefixes:
              - ip: 0.0.0.0/0
                aggregate: false

          - name: match-vrf-01-subnets
            description: match vrf-01 subnets
            prefixes:
              - ip: 10.100.0.0/23
                aggregate: true
              - ip: 10.237.101.0/27
                aggregate: false
              - ip: 10.237.101.32/28
                aggregate: true
              - ip: 10.237.101.48/28
                aggregate: true
              - ip: 10.237.101.96/28
                aggregate: false
              - ip: 10.237.101.112/29
                aggregate: true
              - ip: 10.237.101.120/29
                aggregate: true
              - ip: 10.237.101.128/28
                aggregate: true
              - ip: 10.237.101.144/28
                aggregate: false

          - name: match-ah
            description: attached-host /32s eligible for redistribution into BGP
            prefixes:
              - ip: 0.0.0.0/0
                aggregate: true
                to_length: 32

          - name: match-fsvi
            description: connected floating-SVI 10.100.0.0/23
            prefixes:
              - ip: 10.100.0.0/23
                aggregate: false

          - name: match-vrf-03-subnets
            description: match vrf-03 subnets
            prefixes:
              - ip: 10.100.7.0/24
                aggregate: false
              - ip: 10.100.8.0/24
                aggregate: false
              - ip: 10.237.101.144/28
                aggregate: false

# OSPF Interface Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `OSPF` » `OSPF Interface`
        ospf_interface_policies:
          - name: OSPF_p2p
            passive_interface: false
            mtu_ignore: false
            advertise_subnet: true
            bfd: false
            hello_interval: 10
            dead_interval: 40
            network_type: p2p
            priority: 1
            lsa_retransmit_interval: 5
            lsa_transmit_delay: 1

# Route Control Route Map: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `Route Maps for Route Control`
        route_control_route_maps:
          - name: floating-L3out-optimizations
            type: global
            contexts:
              - name: pods-subnets
                action: permit
                match_rules:
                  - pod-subnets
                set_rule: floating-L3out-optimizations

          - name: export-vrf-01-to-smart-switch-p2p
            type: global
            contexts:
              - name: default-route
                order: 0
                action: permit
                match_rules:
                  - match-all-subnets

          - name: export-vrf-03-to-smart-switch
            type: global
            contexts:
              - name: export-vrf-03-subnets
                order: 0
                action: permit
                match_rules:
                  - match-vrf-03-subnets

          - name: redist-ah
            type: global
            contexts:
              - name: ah
                action: permit
                match_rules:
                  - match-ah
                set_rule: redist-set

          - name: redist-fsvi
            type: global
            contexts:
              - name: fsvi
                action: permit
                match_rules:
                  - match-fsvi
                set_rule: redist-set

# Set Rule: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `Set Rules`
        set_rules:
          - name: floating-L3out-optimizations
            community_mode: append
            next_hop_propagation: true
            multipath: true

          - name: redist-set
            community_mode: append
            next_hop_propagation: false
            multipath: false

# Services: Location in GUI: `Tenants` » `XXX` » `Services`
      services:

# L4L7 Device: Location in GUI: `Tenants` » `XXX` » `Services` » `L4-L7` » `Devices`
        l4l7_devices:
          - name: ftdv-01-adapter-7-gig-0-4
            vmware_vmm_domain: hx-dev-01-vds-01
            context_aware: single-Context
            type: VIRTUAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftdv-01-adapter-7-gig-0-4
                vcenter_name: hx-dev-01-vc01.uktme.cisco.com
                vm_name: ftdv72_82-01.uktme.cisco.com
                interfaces:
                  - name: gig-0-4
                    vnic_name: Network adapter 7
            logical_interfaces:
              - name: gig-0-4
                concrete_interfaces:
                  - device: ftdv-01-adapter-7-gig-0-4
                    interface_name: gig-0-4

          - name: smart-switch-east-west
            physical_domain: smart-switches
            context_aware: single-Context
            type: PHYSICAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: smart-switch-east-west
                interfaces:
                  - name: data
                    pod_id: 1
                    node_id: 1101
                    node2_id: 1102
                    channel: vpc_to_smart-switch
            logical_interfaces:
              - name: data
                vlan: 44
                concrete_interfaces:
                  - device: smart-switch-east-west
                    interface_name: data

# Redirect Policy: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `L4-L7 Policy-Based Redirect`
        redirect_policies:
          - name: redirect-to-ftdv-01-adapter-7-gig-0-4
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.10
                mac: 00:50:56:A1:1C:2B
                redirect_health_group: ftdv-01-adapter-7-gig-0-4

          - name: smart-switch-east-west
            anycast: false
            pod_aware: true
            resilient_hashing: false
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.11
                name: smart-switch-east-west
                redirect_health_group: smart-switch-east-west

# Redirect Health Group: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocol` » `L4-L7 Redirect Health Groups`
        redirect_health_groups:
          - name: ftdv-01-adapter-7-gig-0-4
          - name: smart-switch-east-west

# Service Graph Template: Location in GUI: `Tenants` » `XXX` » `Services` » `L4-L7` » `Service Graph Templates`
        service_graph_templates:
          - name: ftdv-01-adapter-7-gig-0-4
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: isovalent
              name: ftdv-01-adapter-7-gig-0-4
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

          - name: smart-switch-east-west
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: isovalent
              name: smart-switch-east-west
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

# Device Selection Policy: Location in GUI: `Tenants` » `XXX` » `Services` » `L4-L7` » `Device Selection Policies`
        device_selection_policies:
          - contract: any
            service_graph_template: ftdv-01-adapter-7-gig-0-4
            consumer:
              redirect_policy:
                name: redirect-to-ftdv-01-adapter-7-gig-0-4
              logical_interface: gig-0-4
              bridge_domain:
                name: 6.6.6.0_24
            provider:
              redirect_policy:
                name: redirect-to-ftdv-01-adapter-7-gig-0-4
              logical_interface: gig-0-4
              bridge_domain:
                name: 6.6.6.0_24

          - contract: any
            service_graph_template: smart-switch-east-west
            consumer:
              redirect_policy:
                name: smart-switch-east-west
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24-vrf-03
            provider:
              redirect_policy:
                name: smart-switch-east-west
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24-vrf-03

# Filter: Location in GUI: `Tenants` » `XXX` » `Contracts` » `Filters`
