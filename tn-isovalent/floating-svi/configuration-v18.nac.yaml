# Contract: Location in GUI: `Tenants` » `XXX` » `Contracts` » `Standard`
      contracts:
        - name: intra-tenant
          scope: context
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: intra-vrf
          scope: context
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any
            - name: icmp
              filters:
                - filter: icmp
                  action: permit

        - name: permit-to-all-external-subnets
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters: 
                - filter: src-any-dst-any
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: icmp
              filters:
                - filter: icmp
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

        - name: permit-to-egress-subnet
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-ingress-subnet-cluster-1
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-ingress-subnet-cluster-2
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-ilb-vip-subnet
