# Notes:
#
# - Updated local max ECMP to 4
# - Added match rule "pod-subnets" to match all pod subnets (0.0.0.0/0 le 32)
# - Added set rule "floating-L3out-optimizations" to enable next hop propagation and multipath
# - Removed floating SVI from leaf 2103 and 2104
#
# - To fix - security domain for shared-services
#
---
apic:
  tenants:
# The shared-services tenant is unmanaged, the following contracts are exported
    - name: shared-services
      managed: false
      imported_contracts:
        - name: permit-to-tn-isovalent-egress-subnet
          tenant: isovalent
          contract: permit-to-egress-subnet

        - name: permit-to-tn-isovalent-ingress-subnet-cluster-1
          tenant: isovalent
          contract: permit-to-ingress-subnet-cluster-1

        - name: permit-to-tn-isovalent-ingress-subnet-cluster-2
          tenant: isovalent
          contract: permit-to-ingress-subnet-cluster-2

        - name: permit-to-tn-isovalent-node-subnet
          tenant: isovalent
          contract: permit-to-node-subnet

# The isovalent tenant is managed
    - name: isovalent
      description: 10.237.101.0/26 and 10.237.101.144/28
      security_domains:
        - isovalent

# Policies
      policies:
        bgp_address_family_context_policies:
          - name: cilium-cni-bgp-af-context
            description: BGP weights and paths policies for cilium cni
            ebgp_distance: 20
            ibgp_distance: 200
            local_distance: 220
            ebgp_max_ecmp: 64
            ibgp_max_ecmp: 64
            local_max_ecmp: 4
            enable_host_route_leak: false

        bgp_best_path_policies:
          - name: cilium-cni-bgp-as-path
            description: BGP best path policy for cilium cni
            as_path_multipath_relax: true
            ignore_igp_metric: true

        bgp_peer_prefix_policies:
          - name: cilium-cni-bgp-prefix-policy
            description: BGP prefix policies for cilium cni
            action: 'reject'
            threshold: 75
            max_prefixes: 500

        bgp_timer_policies:
          - name: cilium-cni-bgp-timers
            description: BGP timer policies for cilium cni
            keepalive_interval: 1
            hold_interval: 3
            stale_interval: 6
            graceful_restart_helper: true
            maximum_as_limit: 1

          - name: core-bgp-timers
            description: BGP timer policies for core network peering
            keepalive_interval: 60
            hold_interval: 180
            stale_interval: 300
            graceful_restart_helper: true
            maximum_as_limit: 10

        dhcp_relay_policies:
          - name: dhcp.uktme.cisco.com
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-bm-pod-1
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-bm-pod-2
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-vm-hx-dev-01-fi-a-pod-1
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

          - name: dhcp-k8s-vm-hx-dev-01-fi-b-pod-1
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                # l3out: shared-services.vrf-01-ospf-area-0.0.0.1
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

        ip_sla_policies:
          - name: icmp-aggressive-timers
            description: This policy sends a icmp ping every 1 second
            frequency: 1
            multiplier: 3
            sla_type: icmp

        match_rules:
          - name: pod-subnets
            description: match all pod subnets
            prefixes:
              - ip: 0.0.0.0/0
                aggregate: true
                to_length: 0

          - name: match-bridge-domain-subnets
            description: match all bridge domain subnets
            prefixes:
              - ip: 10.237.101.96/28
                aggregate: false
              - ip: 10.237.101.144/28
                aggregate: false

          - name: match-isovalent-supernet
            description: match isovalent address space
            prefixes:
              - ip: 10.100.0.0/23
                aggregate: true

          - name: match-k8s-node-subnet
            description: match all k8s node subnet
            prefixes:
              - ip: 10.237.101.0/27
                aggregate: false

          - name: match-k8s-egress-subnet-cluster-1
            description: match all k8s egress subnet cluster 1
            prefixes:
              - ip: 10.237.101.48/28
                aggregate: true

          - name: match-k8s-egress-subnet-cluster-2
            description: match all k8s egress subnet cluster 2
            prefixes:
              - ip: 10.237.101.120/29
                aggregate: true

          - name: match-k8s-ingress-subnet-cluster-1
            description: match all k8s ingress subnet cluster 1
            prefixes:
              - ip: 10.237.101.32/28
                aggregate: true

          - name: match-k8s-ingress-subnet-cluster-2
            description: match all k8s ingress subnet cluster 2
            prefixes:
              - ip: 10.237.101.112/29
                aggregate: true

          - name: match-k8s-ilb-vip-subnet
            description: match all k8s ilb vip subnet
            prefixes:
              - ip: 10.237.101.128/29
                aggregate: true

        ospf_interface_policies:
          - name: OSPF_p2p
            passive_interface: false
            mtu_ignore: false
            advertise_subnet: true
            bfd: false
            hello_interval: 10
            dead_interval: 40
            network_type: p2p
            priority: 1
            lsa_retransmit_interval: 5
            lsa_transmit_delay: 1

        route_control_route_maps:
          - name: floating-L3out-optimizations
            type: global
            contexts:
              - name: pods-subnets
                action: permit
                match_rules:
                  - pod-subnets
                set_rule: floating-L3out-optimizations
            
        set_rules:
          - name: floating-L3out-optimizations
            community_mode: append
            next_hop_propagation: true
            multipath: true

# Services
      services:
        l4l7_devices:
          - name: ftdv-01-adapter-7-gig-0-4
            vmware_vmm_domain: hx-dev-01-vds-01
            context_aware: single-Context
            type: VIRTUAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftdv-01-adapter-7-gig-0-4
                vcenter_name: hx-dev-01-vc01.uktme.cisco.com
                vm_name: ftdv72_82-01.uktme.cisco.com
                interfaces:
                  - name: gig-0-4
                    vnic_name: Network adapter 7
            logical_interfaces:
              - name: gig-0-4
                concrete_interfaces:
                  - device: ftdv-01-adapter-7-gig-0-4
                    interface_name: gig-0-4

        redirect_policies:
          - name: redirect-to-ftdv-01-adapter-7-gig-0-4
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.10
                mac: 00:50:56:A1:1C:2B
                redirect_health_group: ftdv-01-adapter-7-gig-0-4

        redirect_health_groups:
          - name: ftdv-01-adapter-7-gig-0-4

        service_graph_templates:
          - name: ftdv-01-adapter-7-gig-0-4
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: isovalent
              name: ftdv-01-adapter-7-gig-0-4
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

        device_selection_policies:
          - contract: any
            service_graph_template: ftdv-01-adapter-7-gig-0-4
            consumer:
              redirect_policy:
                name: redirect-to-ftdv-01-adapter-7-gig-0-4
              logical_interface: gig-0-4
              bridge_domain:
                name: 6.6.6.0_24
            provider:
              redirect_policy:
                name: redirect-to-ftdv-01-adapter-7-gig-0-4
              logical_interface: gig-0-4
              bridge_domain:
                name: 6.6.6.0_24

# Filters
      filters:
        - name: 'icmp'
          entries:
            - name: 'icmp'
              protocol: icmp

        - name: 'src-any-dst-any'
          entries:
            - name: 'src-any-dst-any'
              ethertype: unspecified

        - name: 'ipv4-src-any-dst-any'
          entries:
            - name: 'ipv4-src-any-dst-any'
              ethertype: ipv4

        - name: tcp-src-any-dst-any
          entries:
            - name: tcp-src-any-dst-any
              protocol: tcp
              destination_to_port: unspecified

# TCP
        - name: 'tcp-src-22-dst-any'
          entries:
            - name: 'tcp-src-22-dst-any'
              ethertype: ipv4
              protocol: tcp
              source_from_port: 22
              source_to_port: 22

        - name: 'tcp-src-any-dst-any-stateful'
          entries:
            - name: 'tcp-src-any-dst-any-stateful'
              ethertype: ip
              protocol: tcp
              stateful: true

        - name: 'tcp-src-any-dst-22-stateful'
          entries:
            - name: 'tcp-src-any-dst-22-stateful'
              protocol: tcp
              destination_from_port: 22
              destination_to_port: 22
              stateful: true

        - name: 'tcp-src-80-dst-any'
          entries:
            - name: 'tcp-src-80-dst-any'
              ethertype: ipv4
              protocol: tcp
              source_from_port: 80
              source_to_port: 80

        - name: 'tcp-src-443-dst-any'
          entries:
            - name: 'tcp-src-443-dst-any'
              ethertype: ipv4
              protocol: tcp
              source_from_port: 443
              source_to_port: 443

        - name: 'tcp-src-any-dst-22'
          entries:
            - name: 'tcp-src-any-dst-22'
              ethertype: ipv4
              protocol: tcp
              destination_from_port: 22
              destination_to_port: 22

        - name: 'tcp-src-any-dst-53'
          entries:
            - name: 'tcp-src-any-dst-53'
              ethertype: ipv4
              protocol: tcp
              destination_from_port: 53
              destination_to_port: 53

        - name: 'tcp-src-any-dst-80'
          entries:
            - name: 'tcp-src-any-dst-80'
              ethertype: ipv4
              protocol: tcp
              destination_from_port: 80
              destination_to_port: 80

        - name: 'tcp-src-any-dst-443'
          entries:
            - name: 'tcp-src-any-dst-443'
              ethertype: ipv4
              protocol: tcp
              destination_from_port: 443
              destination_to_port: 443

        - name: 'tcp-src-any-dst-4240'
          entries:
            - name: 'tcp-src-any-dst-4240'
              protocol: tcp
              destination_from_port: 4240
              destination_to_port: 4240

        - name: 'tcp-src-any-dst-4444'
          entries:
            - name: 'tcp-src-any-dst-4444'
              protocol: tcp
              destination_from_port: 4444
              destination_to_port: 4444

        - name: 'tcp-src-any-dst-6443'
          entries:
            - name: 'tcp-src-any-dst-6443'
              protocol: tcp
              destination_from_port: 6443
              destination_to_port: 6443

        - name: 'tcp-src-any-dst-19765'
          entries:
            - name: 'tcp-src-any-dst-19765'
              protocol: tcp
              destination_from_port: 19765
              destination_to_port: 19765

# UDP
        - name: 'udp-src-any-dst-53'
          entries:
            - name: 'udp-src-any-dst-53'
              ethertype: ipv4
              protocol: udp
              destination_from_port: 53
              destination_to_port: 53

        - name: 'udp-src-any-dst-67'
          entries:
            - name: 'udp-src-any-dst-67'
              ethertype: ipv4
              protocol: udp
              destination_from_port: 67
              destination_to_port: 67

        - name: udp-src-68-dst-any
          entries:
            - name: udp-src-68-dst-any
              ethertype: ipv4
              protocol: udp
              source_from_port: 68
              source_to_port: 68

        - name: 'udp-src-any-dst-514'
          entries:
            - name: 'udp-src-any-dst-514'
              ethertype: ipv4
              protocol: udp
              destination_from_port: 514
              destination_to_port: 514

        - name: 'udp-src-any-dst-123'
          entries:
            - name: 'udp-src-any-dst-123'
              ethertype: ipv4
              protocol: udp
              destination_from_port: 123
              destination_to_port: 123

        - name: 'udp-src-any-dst-5140'
          entries:
            - name: 'udp-src-any-dst-5140'
              ethertype: ipv4
              protocol: udp
              destination_from_port: 5140
              destination_to_port: 5140

        - name: udp-src-any-dst-any
          entries:
            - name: udp-src-any-dst-any
              protocol: udp
              destination_to_port: unspecified

# Contracts
      contracts:
        - name: intra-tenant
          scope: context
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-all-external-subnets
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters: 
                - filter: src-any-dst-any
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: icmp
              filters:
                - filter: icmp
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

        - name: permit-to-egress-subnet
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-ingress-subnet-cluster-1
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-ingress-subnet-cluster-2
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-ilb-vip-subnet
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-node-subnet
          scope: tenant
          subjects:
            - name: permit-ipv4-src-any-dst-any
              filters: 
                - filter: ipv4-src-any-dst-any

        - name: permit-to-pod-subnet-cluster-1
          description: Allow filtered traffic to pod subnet cluster 1
          scope: context
          subjects:
            - name: icmp
              filters:
                - filter: icmp
            - name: tcp
              filters: 
                - filter: tcp-src-any-dst-any
            - name: udp
              filters:
                - filter: udp-src-any-dst-any

        - name: permit-to-pod-subnet-cluster-2
          description: Allow filtered traffic to pod subnet cluster 2
          scope: context
          subjects:
            - name: icmp
              filters:
                - filter: icmp
            - name: tcp
              filters: 
                - filter: tcp-src-any-dst-any
            - name: udp
              filters:
                - filter: udp-src-any-dst-any

        - name: permit-to-nginx-subnet-10.237.101.96_28
          scope: context
          subjects:
            - name: tcp
              filters: 
                - filter: 'tcp-src-any-dst-80'
                - filter: 'tcp-src-any-dst-4444'
                - filter: 'tcp-src-any-dst-19765'
            - name: icmp
              filters:
                - filter: icmp

        - name: permit-from-core-services
          scope: tenant
          subjects:
            - name: tcp
              filters:
                - filter: 'tcp-src-22-dst-any'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false
                - filter: 'tcp-src-443-dst-any'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: udp
              filters:
                - filter: 'udp-src-68-dst-any'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: icmp
              filters:
                - filter: icmp
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

        - name: permit-to-core-services
          scope: tenant
          subjects:
            - name: tcp
              filters:
                - filter: 'tcp-src-any-dst-22'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false
                - filter: 'tcp-src-any-dst-80'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false
                - filter: 'tcp-src-any-dst-443'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: udp
              filters:
                - filter: 'udp-src-any-dst-53'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

                - filter: 'udp-src-any-dst-67'
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: icmp
              filters:
                - filter: icmp
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

        - name: permit-from-lab-desktops
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: icmp
              filters:
                - filter: icmp
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

        - name: permit-to-lab-desktops
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

            - name: icmp
              filters:
                - filter: icmp
                  action: permit
                  priority: default
                  log: false
                  no_stats: false

# VRFs
      vrfs:
        - name: vrf-01
          description: configured with NAC
          alias: internal-vrf
          contracts:
            # providers: 
            #   - intra-tenant
            consumers:
              # - intra-tenant
              - permit-to-all-external-subnets
              - permit-from-core-services
              - permit-to-core-services
              - permit-to-lab-desktops

          leaked_internal_subnets:
            - prefix: 10.237.101.96/28
              public: true
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.144/28
              public: true
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
          leaked_external_prefixes:
            - prefix: 10.100.0.0/23
              # from_prefix_length: 32
              # to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.0/27
              # from_prefix_length: 32
              # to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.32/28
              from_prefix_length: 32
              to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.48/28
              from_prefix_length: 32
              to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.112/29
              from_prefix_length: 32
              to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.120/29
              from_prefix_length: 32
              to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02
            - prefix: 10.237.101.128/29
              # from_prefix_length: 32
              # to_prefix_length: 32
              destinations:
                - tenant: isovalent
                  vrf: vrf-02

        - name: vrf-02
          description: configured with NAC
          alias: external-vrf
          leaked_external_prefixes:
            - prefix: 0.0.0.0/0
              destinations:
                - tenant: isovalent
                  vrf: vrf-01

# L3Outs
      l3outs:
        - name: isovalent.vrf-01
          description: L3out SVI to Isovalent K8s environment AS65252
          alias: vrf-01-to-k8s
          vrf: vrf-01
          domain: isovalent.vrf-01
          import_route_control_enforcement: true
          # interleak_route_map: route-map-for-floating-L3out-optimizations
          # redistribution_route_maps:
          #   - source: attached-host
          #     route_map: route-map-for-floating-L3out-optimizations

# Nodes
          node_profiles:
            - name: border-leafs
              nodes:
                - node_id: 1101
                  pod_id: 1
                  router_id: 110.1.5.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 110.1.5.11

                - node_id: 1102
                  pod_id: 1
                  router_id: 110.2.5.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 110.2.5.11

                - node_id: 2101
                  pod_id: 2
                  router_id: 210.1.5.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 210.1.5.11

                - node_id: 2102
                  pod_id: 2
                  router_id: 210.2.5.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 210.2.5.11

              bgp:
                timer_policy: cilium-cni-bgp-timers
                as_path_policy: cilium-cni-bgp-as-path

              interface_profiles:

# Pod 1
                - name: k8s-nodes     # this creates a single interface profile  for both pods with a floating SVI
                  interfaces:
                    - node_id: 1101                       
                      mode: regular                       
                      floating_svi: true
                      vlan: 50
                      paths:
                        - floating_ip: 10.237.101.3/27
                          physical_domain: isovalent-nodes
                      ip: 10.237.101.1/27
                      ip_shared: 10.237.101.4/27
                      bgp_peers:
                        - ip: 10.237.101.0/27
                          description: k8s virtual machine nodes via FIa
                          remote_as: 65252
                          local_as: 65151
                          allow_self_as: false
                          as_override: true
                          disable_peer_as_check: true
                          next_hop_self: false
                          send_community: false
                          send_ext_community: false
                          allowed_self_as_count: 3
                          bfd: false
                          disable_connected_check: false
                          ttl: 1
                          remove_all_private_as: false
                          remove_private_as: false
                          replace_private_as_with_local_as: false
                          unicast_address_family: true
                          multicast_address_family: false
                          admin_state: true
                          as_propagate: no-prepend
                          peer_prefix_policy: cilium-cni-bgp-prefix-policy
                          import_route_control: floating-L3out-optimizations

                    - node_id: 1101                                           
