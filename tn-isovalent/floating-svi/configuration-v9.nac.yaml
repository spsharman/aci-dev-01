# bridge domains
      bridge_domains:
        - name: 6.6.6.0_24
          description: PBR subnet, not advertised - local to VRF
          alias: internal-subnet
          unknown_unicast: proxy
          vrf: vrf-01
          subnets:
            - ip: 6.6.6.1/24
              public: false

        - name: 10.237.101.96_28
          description: corporate subnet
          alias: corporate-subnet
          unknown_unicast: proxy
          vrf: vrf-01
          subnets:
            - ip: 10.237.101.97/28
              public: true
              shared: true
              nd_ra_prefix: false
          dhcp_labels:
            - dhcp_relay_policy: dhcp.uktme.cisco.com
              scope: tenant                                                              

        - name: 10.237.101.144_28
          description: corporate subnet
          alias: corporate-subnet
          unknown_unicast: proxy
          vrf: vrf-01
          subnets:
            - ip: 10.237.101.145/28
              public: true
              shared: true
              nd_ra_prefix: false
          dhcp_labels:
            - dhcp_relay_policy: dhcp.uktme.cisco.com
              scope: tenant  

# Application Profiles
      application_profiles:
        - name: 'network-segments'
          description: EPGs provide the VLAN backing for application workloads
          endpoint_groups:
            - name: '10.237.101.96_28'
              bridge_domain: '10.237.101.96_28'
              vmware_vmm_domains:
                - name: 'hx-dev-01-vds-01'
                  custom_epg_name: isovalent-network-segments-10.237.101.96-28
                  u_segmentation: false
                  deployment_immediacy: immediate
                  resolution_immediacy: immediate

            - name: '10.237.101.144_28'
              bridge_domain: '10.237.101.144_28'
              vmware_vmm_domains:
                - name: 'hx-dev-01-vds-01'
                  custom_epg_name: isovalent-jumphosts-10.237.101.144-28
                  u_segmentation: false
                  deployment_immediacy: immediate
                  resolution_immediacy: immediate

        - name: 'network-segments-esgs'
          description: 'ESGs are used to define security groups' 
          endpoint_security_groups:
            - name: 10.237.101.96_28-nginx-subnet
              vrf: vrf-01
              shutdown: false
              intra_esg_isolation: false
              preferred_group: false
              epg_selectors:
                - application_profile: 'network-segments'
                  endpoint_group: '10.237.101.96_28'
              contracts:
                consumers:
                  - permit-to-ingress-subnet-cluster-1
                  - permit-to-ingress-subnet-cluster-2
                  - permit-to-ilb-vip-subnet
                providers:
                  - permit-to-nginx-subnet-10.237.101.96_28

            - name: 10.237.101.144_28-jumphosts
              vrf: vrf-01
              shutdown: false
              intra_esg_isolation: false
              preferred_group: false
              epg_selectors:
                - application_profile: 'network-segments'
                  endpoint_group: '10.237.101.144_28'
              contracts:
                consumers:
                  - permit-to-node-subnet
                  - permit-to-nginx-subnet-10.237.101.96_28
                  - permit-to-ingress-subnet-cluster-1
                  - permit-to-ingress-subnet-cluster-2
                  - permit-to-ilb-vip-subnet

        - name: 'egress-subnets-esgs'
          description: 'ESGs are used to define security groups'
          endpoint_security_groups:
            - name: egress-subnet-cluster-1
              vrf: vrf-01
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.101.48/28
                  shared: true
              contracts:
                consumers:
                  - permit-to-nginx-subnet-10.237.101.96_28
            - name: egress-subnet-cluster-2
              vrf: vrf-01
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.101.120/29
                  shared: true
              contracts:
                consumers:
                  - permit-to-nginx-subnet-10.237.101.96_28

        - name: 'ingress-subnets-esgs'
          description: 'ESGs are used to define security groups'
          endpoint_security_groups:
            - name: ingress-subnet-cluster-1
              vrf: vrf-01
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.101.32/28
                  shared: true
              contracts:
                providers:
                  - permit-to-ingress-subnet-cluster-1
            - name: ingress-subnet-cluster-2
              vrf: vrf-01
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.101.112/29
                  shared: true
              contracts:
                providers:
                  - permit-to-ingress-subnet-cluster-2

        - name: 'ilb-vip-subnets-esgs'
          description: 'ESGs are used to define security groups'
          endpoint_security_groups:
            - name: ilb-vip-subnet
              vrf: vrf-01
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.101.128/29
                  shared: true
              contracts:
                providers:
                  - permit-to-ilb-vip-subnet

        - name: 'node-subnets-esgs'
          description: 'ESGs are used to define security groups'
          endpoint_security_groups:
            - name: node-subnets
              vrf: vrf-01
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.100.0.0/23
                  shared: true
                - ip: 10.237.101.0/27
                  shared: true
              contracts:
                providers:
                  - permit-to-node-subnet
                consumers:
                  - permit-to-ingress-subnet-cluster-1
                  - permit-to-ingress-subnet-cluster-2
                  - permit-to-ilb-vip-subnet
                  - permit-to-pod-subnet-cluster-1
                  - permit-to-pod-subnet-cluster-2

        - name: 'external-subnets-esgs'
          description: 'ESGs are used to define security groups'
          endpoint_security_groups:
            - name: core-services
              vrf: vrf-02
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.97.128/27
                  shared: true
              contracts:
                providers:
                  - permit-to-core-services
                  - permit-from-core-services
            - name: lab-desktops
              vrf: vrf-02
              deployment_immediacy: immediate
              ip_external_subnet_selectors:
                - ip: 10.237.97.160/28
                  shared: true
              contracts:
                providers:
                  - permit-to-lab-desktops
            - name: all-external-subnets
