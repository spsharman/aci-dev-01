# Notes:
# Subnet 10.5.0.0/21
# ESG/Contract relationships:
# An ESG can be a provider or consumer of a contract. Additionally the ESG can have an intra ESG contract applied.
# - If an ESG is the provider of a contract the contract name is `<application-profile-name>-permit-to-<ESG-name>`
# - If an ESG is the consumer of a contract the contract name is `<application-profile-name>-permit-from-<ESG-name>`
# - If an ESG has an intra ESG contract applied, the contract name is `<application-profile-name>-permit-intra-<ESG-name>`

# Description: Build v02 delta from v01.
# Adds IP SLA policy (icmp-aggressive-timers) for service node health monitoring.
# Adds the following L4-L7 service nodes:
#   - ftdv-01-north-south  (FTDv virtual firewall, GoTo, north-south traffic)
#   - ftdv-01-east-west-L7 (FTDv virtual firewall, GoTo, east-west L7 inspection)
#   - ftdv-02-east-west    (FTDv virtual firewall, GoTo, east-west traffic)
#   - smart-switch-east-west (physical appliance via VPC)
# Adds service graphs, PBR redirect policies, and health groups for each device.
# Applies service graphs to the intra-vrf contract to redirect traffic through the service nodes.
---
apic:

# Tenants: Location in GUI: `Tenants`
  tenants:
    - name: tech-elevate
      description: blueprint - v02 add service nodes
      managed: true
      security_domains:
        - tech-elevate

# Policies: Location in GUI: `Tenants` » `XXX` » `Policies`
      policies:

# BGP Address Family Context Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `BGP` » `Address Family Context`
        bgp_address_family_context_policies:
          - name: cilium-cni-bgp-af-context
            description: BGP weights and paths policies for cilium cni
            ebgp_distance: 20
            ibgp_distance: 200
            local_distance: 220
            ebgp_max_ecmp: 64
            ibgp_max_ecmp: 64
            local_max_ecmp: 4
            enable_host_route_leak: false

# BGP Best Path Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `BGP` » `Best Path`
        bgp_best_path_policies:
          - name: cilium-cni-bgp-as-path
            description: BGP best path policy for cilium cni
            as_path_multipath_relax: true
            ignore_igp_metric: false

# BGP Peer Prefix Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `BGP` » `Peer Prefix`
        bgp_peer_prefix_policies:
          - name: cilium-cni-bgp-prefix-policy
            description: BGP prefix policies for cilium cni
            action: 'reject'
            threshold: 75
            max_prefixes: 500

# BGP Timer Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `BGP` » `Timers`
        bgp_timer_policies:
          - name: cilium-cni-bgp-timers
            description: BGP timer policies for cilium cni
            keepalive_interval: 1
            hold_interval: 3
            stale_interval: 6
            graceful_restart_helper: true
            maximum_as_limit: 1

# DHCP Relay Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocols` » `DHCP Relay`
        dhcp_relay_policies:
          - name: dhcp.uktme.cisco.com
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: core-services-subnets

# IP SLA Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocols` » `IP SLA`
        ip_sla_policies:
          - name: icmp-aggressive-timers
            description: This policy sends a icmp ping every 1 second
            frequency: 1
            multiplier: 3
            sla_type: icmp

# Match Rules: Location in GUI: `Tenants` » `XXX` » `Policies` » `Routing` » `Match Rules`
        match_rules:
          - name: match-bridge-domain-subnets
            description: match all bridge domain subnets
            prefixes:
              - ip: 10.5.0.0/21
                aggregate: true

          - name: pod-subnets-redistribution
            description: match all pod subnets
            prefixes:
              - ip: 0.0.0.0/0
                aggregate: true
                to_length: 32

          - name: match-k8s-node-subnet
            description: matches K8s node subnets
            prefixes:
              - ip: 10.237.97.224/28
                aggregate: false

          - name: match-k8s-applications
            description: matches K8s applications VIP
            prefixes:
              - ip: 10.237.99.72/27
                aggregate: true

# OSPF Interface Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocols` » `OSPF Interface`
        ospf_interface_policies:
          - name: OSPF_p2p
            passive_interface: false
            mtu_ignore: false
            advertise_subnet: true
            bfd: false
            hello_interval: 10
            dead_interval: 40
            network_type: p2p
            priority: 1
            lsa_retransmit_interval: 5
            lsa_transmit_delay: 1

# Route Control Route Maps: Location in GUI: `Tenants` » `XXX` » `Policies` » `Routing` » `Route Maps`
        route_control_route_maps:
          - name: floating-L3out-redistribution-optimization
            type: global
            contexts:
              - name: pods-subnets
                action: permit
                match_rules:
                  - pod-subnets-redistribution
                set_rule: floating-L3out-bgp-redistribution-optimization

# Set Rules: Location in GUI: `Tenants` » `XXX` » `Policies` » `Routing` » `Set Rules`
        set_rules:
          - name: floating-L3out-bgp-redistribution-optimization
            community_mode: append
            multipath: false
            next_hop_propagation: false

# Services: Location in GUI: `Tenants` » `XXX` » `Services`
      services:

# L4L7 Devices: Location in GUI: `Tenants` » `XXX` » `Services` » `L4L7 Devices`
        l4l7_devices:
          - name: ftdv-01-north-south
            vmware_vmm_domain: hx-dev-01-vds-01
            context_aware: single-Context
            type: VIRTUAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftdv-01-adapter-6-gig-0-3
                vcenter_name: hx-dev-01-vc01.uktme.cisco.com
                vm_name: ftdv72_82-01.uktme.cisco.com
                interfaces:
                  - name: ftdv-01-gig-0-3
                    vnic_name: Network adapter 6

            logical_interfaces:
              - name: data
                concrete_interfaces:
                  - device: ftdv-01-adapter-6-gig-0-3
                    interface_name: ftdv-01-gig-0-3

          - name: ftdv-01-east-west-L7
            vmware_vmm_domain: hx-dev-01-vds-01
            context_aware: single-Context
            type: VIRTUAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftdv-01-adapter-8-gig-0-5
                vcenter_name: hx-dev-01-vc01.uktme.cisco.com
                vm_name: ftdv72_82-01.uktme.cisco.com
                interfaces:
                  - name: ftdv-01-gig-0-5
                    vnic_name: Network adapter 8

            logical_interfaces:
              - name: data
                concrete_interfaces:
                  - device: ftdv-01-adapter-8-gig-0-5
                    interface_name: ftdv-01-gig-0-5

          - name: ftdv-02-east-west
            vmware_vmm_domain: hx-dev-01-vds-01
            context_aware: single-Context
            type: VIRTUAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftdv-02-adapter-5-gig-0-2
                vcenter_name: hx-dev-01-vc01.uktme.cisco.com
                vm_name: ftdv72_82-02.uktme.cisco.com
                interfaces:
                  - name: data
                    vnic_name: Network adapter 5

            logical_interfaces:
              - name: data
                concrete_interfaces:
                  - device: ftdv-02-adapter-5-gig-0-2
                    interface_name: data

          - name: smart-switch-east-west
            physical_domain: smart-switches
            context_aware: single-Context
            type: PHYSICAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: smart-switch-east-west
                interfaces:
                  - name: data
                    pod_id: 1
                    node_id: 1101
                    node2_id: 1102
                    channel: vpc_to_smart-switch
            logical_interfaces:
              - name: data
                vlan: 30
                concrete_interfaces:
                  - device: smart-switch-east-west
                    interface_name: data

# Redirect Policies: Location in GUI: `Tenants` » `XXX` » `Services` » `Redirect Policies`
        redirect_policies:
          - name: ftdv-01-north-south
            anycast: false
            pod_aware: true
            resilient_hashing: false
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.10
                name: ftdv-01
                redirect_health_group: ftdv-01-north-south

          - name: ftdv-01-east-west-L7
            anycast: false
            pod_aware: true
            resilient_hashing: false
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.13
                name: ftdv-01
                redirect_health_group: ftdv-01-east-west-L7

          - name: ftdv-02-east-west
            anycast: false
            pod_aware: true
            resilient_hashing: false
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.12
                name: ftdv-02-east-west
                redirect_health_group: ftdv-02-east-west

          - name: smart-switch-east-west
            anycast: false
            pod_aware: true
            resilient_hashing: false
            ip_sla_policy: icmp-aggressive-timers
            l3_destinations:
              - ip: 6.6.6.11
                name: smart-switch-east-west
                redirect_health_group: smart-switch-east-west

# Service Graph Templates: Location in GUI: `Tenants` » `XXX` » `Services` » `Service Graph Templates`
        service_graph_templates:
          - name: ftdv-01-north-south
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: tech-elevate
              name: ftdv-01-north-south
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

          - name: ftdv-01-east-west-L7
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: tech-elevate
              name: ftdv-01-east-west-L7
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

          - name: ftdv-02-east-west
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: tech-elevate
              name: ftdv-02-east-west
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

          - name: smart-switch-east-west
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: tech-elevate
              name: smart-switch-east-west
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

# Device Selection Policies: Location in GUI: `Tenants` » `XXX` » `Services` » `Device Selection Policies`
        device_selection_policies:
          - contract: any
            service_graph_template: ftdv-01-north-south
            consumer:
              redirect_policy:
                name: ftdv-01-north-south
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24
            provider:
              redirect_policy:
                name: ftdv-01-north-south
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24

          - contract: any
            service_graph_template: ftdv-01-east-west-L7
            consumer:
              redirect_policy:
                name: ftdv-01-east-west-L7
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24
            provider:
              redirect_policy:
                name: ftdv-01-east-west-L7
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24

          - contract: any
            service_graph_template: ftdv-02-east-west
            consumer:
              redirect_policy:
                name: ftdv-02-east-west
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24
            provider:
              redirect_policy:
                name: ftdv-02-east-west
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24

          - contract: any
            service_graph_template: smart-switch-east-west
            consumer:
              redirect_policy:
                name: smart-switch-east-west
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24
            provider:
              redirect_policy:
                name: smart-switch-east-west
              logical_interface: data
              bridge_domain:
                name: 6.6.6.0_24

# Redirect Health Groups: Location in GUI: `Tenants` » `XXX` » `Services` » `Redirect Health Groups`
        redirect_health_groups:
          - name: ftdv-01-north-south
          - name: ftdv-01-east-west-L7
          - name: ftdv-02-east-west
          - name: smart-switch-east-west

# Filters: Location in GUI: `Tenants` » `XXX` » `Contracts` » `Filters`
      filters:
        - name: 'icmp'
          entries:
            - name: 'icmp'
              protocol: icmp

        - name: 'src-any-dst-any'
          entries:
            - name: 'src-any-dst-any'
              ethertype: unspecified

        - name: 'tcp-c2p-src-any-dst-any-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-any-stateful'
              ethertype: ip
              protocol: tcp
              stateful: true

        - name: 'tcp-c2p-src-any-dst-22-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-22-stateful'
              protocol: tcp
              destination_from_port: 22
              destination_to_port: 22
              stateful: true

        - name: 'tcp-c2p-src-any-dst-80-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-80-stateful'
              protocol: tcp
              destination_from_port: 80
              destination_to_port: 80
              stateful: true

        - name: 'tcp-p2c-src-80-dst-any-flag-ack'
          entries:
            - name: 'tcp-p2c-src-80-dst-any-flag-ack'
              protocol: tcp
              source_from_port: 80
              source_to_port: 80
              tcp_rules: ack

        - name: 'tcp-c2p-src-any-dst-80-flag-syn'
          entries:
            - name: 'tcp-c2p-src-any-dst-80-flag-syn'
              protocol: tcp
              destination_from_port: 80
              destination_to_port: 80
              tcp_rules: syn

        - name: 'tcp-c2p-src-any-dst-80-flag-est'
          entries:
            - name: 'tcp-c2p-src-any-dst-80-flag-est'
              protocol: tcp
              destination_from_port: 80
              destination_to_port: 80
              tcp_rules: est

        - name: 'tcp-c2p-src-any-dst-80-flag-fin'
          entries:
            - name: 'tcp-c2p-src-any-dst-80-flag-fin'
              protocol: tcp
              destination_from_port: 80
              destination_to_port: 80
              tcp_rules: fin

        - name: 'tcp-c2p-src-any-dst-443-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-443-stateful'
              protocol: tcp
              destination_from_port: 443
              destination_to_port: 443
              stateful: true

        - name: 'tcp-c2p-src-any-dst-6443-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-6443-stateful'
              protocol: tcp
              destination_from_port: 6443
              destination_to_port: 6443
              stateful: true

        - name: 'tcp-c2p-src-any-dst-8080-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-8080-stateful'
              protocol: tcp
              destination_from_port: 8080
              destination_to_port: 8080
              stateful: true

        - name: 'tcp-c2p-src-any-dst-8099-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-8099-stateful'
              protocol: tcp
              destination_from_port: 8099
              destination_to_port: 8099
              stateful: true

        - name: 'tcp-c2p-src-any-dst-8443-stateful'
          entries:
            - name: 'tcp-c2p-src-any-dst-8443-stateful'
              protocol: tcp
              destination_from_port: 8443
              destination_to_port: 8443
              stateful: true

        - name: 'udp-src-any-dst-any'
          entries:
            - name: 'udp-src-any-dst-any'
              ethertype: ip
              protocol: udp

        - name: 'udp-c2p-src-any-dst-53'
          entries:
            - name: 'udp-c2p-src-any-dst-53'
              ethertype: ip
              protocol: udp
              destination_from_port: 53
              destination_to_port: 53

        - name: 'udp-c2p-src-any-dst-123'
          entries:
            - name: 'udp-c2p-src-any-dst-123'
              ethertype: ip
              protocol: udp
              destination_from_port: 123
              destination_to_port: 123

        - name: 'udp-c2p-src-any-dst-10230'
          entries:
            - name: 'udp-c2p-src-any-dst-10230'
              ethertype: ip
              protocol: udp
              destination_from_port: 10230
              destination_to_port: 10230

# Contracts: Location in GUI: `Tenants` » `XXX` » `Contracts` » `Standard`
      contracts:
        - name: intra-vrf
          description: vzAny is contract Consumer and Provider
          scope: context
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any

        - name: epg-security-groups-permit-from-all-epgs
          description: esg-all-epgs is the contract Consumer
          scope: tenant
          subjects:
            - name: tcp
              filters:
                - filter: tcp-c2p-src-any-dst-any-stateful
            - name: udp
              filters:
                - filter: udp-c2p-src-any-dst-53
                - filter: udp-c2p-src-any-dst-123                
            - name: icmp
              filters:
                - filter: icmp

        - name: epg-security-groups-permit-to-all-epgs
          description: esg-all-epgs is the contract Provider
          scope: tenant
          subjects:
            - name: tcp
              filters:
                - filter: tcp-c2p-src-any-dst-22-stateful
                - filter: tcp-c2p-src-any-dst-80-stateful
                - filter: tcp-c2p-src-any-dst-443-stateful
                - filter: tcp-c2p-src-any-dst-6443-stateful
                - filter: tcp-c2p-src-any-dst-8080-stateful
                - filter: tcp-c2p-src-any-dst-8099-stateful
                - filter: tcp-c2p-src-any-dst-8443-stateful
            - name: udp
              filters:
                - filter: udp-c2p-src-any-dst-10230
            - name: icmp
              filters:
                - filter: icmp

        - name: k8s-nodes-permit-from-all-nodes
          description: k8s nodes is the contract Consumer
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any

        - name: k8s-nodes-permit-to-all-nodes
          description: k8s nodes is the contract Provider
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any

        - name: k8s-applications-permit-from-all-applications
          description: k8s applications is the contract Consumer
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any

        - name: k8s-applications-permit-to-all-applications
          description: k8s applications is the contract Provider
          scope: tenant
          subjects:
            - name: permit-src-any-dst-any
              filters:
                - filter: src-any-dst-any

# VRFs: Location in GUI: `Tenants` » `XXX` » `Networking` » `VRFs`
      vrfs:
        - name: vrf-02
          description: configured with NAC
          alias: outside-vrf
          leaked_external_prefixes:
            - prefix: 0.0.0.0/0
              destinations:
                - tenant: tech-elevate
                  vrf: vrf-01

        - name: vrf-01
          description: configured with NAC
          alias: inside-vrf
          contracts:
            providers:
              - intra-vrf
            consumers:
              - intra-vrf
          leaked_internal_subnets:
            - prefix: 10.5.0.0/24
              public: true
              destinations:
                - tenant: tech-elevate
                  vrf: vrf-02
            - prefix: 10.5.1.0/24
              public: true
              destinations:
                - tenant: tech-elevate
                  vrf: vrf-02
            - prefix: 10.5.2.0/24
              public: true
              destinations:
                - tenant: tech-elevate
                  vrf: vrf-02

          leaked_external_prefixes:
            - prefix: 10.237.97.224/28
              destinations:
                - tenant: tech-elevate
                  vrf: vrf-02
            - prefix: 10.237.99.72/29
              from_prefix_length: 32
              to_prefix_length: 32
              destinations:
                - tenant: tech-elevate
                  vrf: vrf-02

# L3out: Location in GUI: `Tenants` » `XXX` » `Networking` » `L3Outs`
      l3outs:
        - name: vrf-02-bgp-AS-64805
          alias: outside-vrf-to-core
          description: L3out peering to core
          vrf: vrf-02
          domain: tech-elevate.vrf-02
          ospf:
            area: backbone
            area_type: regular
          export_route_map:
            type: global
            contexts:
              - name: export-internal-vrf-subnets
                order: 0
                action: permit
                match_rules:
                  - match-k8s-node-subnet
                  - match-k8s-applications
                  - match-bridge-domain-subnets

# Nodes
          node_profiles:
            - name: border-leafs-pod-1
              nodes:
                - node_id: 1101
                  pod_id: 1
                  router_id: 110.1.8.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 110.1.8.11

                - node_id: 1102
                  pod_id: 1
                  router_id: 110.2.8.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 110.2.8.11

              bgp_peers:
                - ip: 12.0.0.3
                  description: L12-C93180YC-FX-01
                  remote_as: 64800
                  local_as: 64805
                  allow_self_as: false
                  as_override: true
                  disable_peer_as_check: true
                  next_hop_self: false
                  send_community: false
                  send_ext_community: false
                  allowed_self_as_count: 3
                  bfd: false
                  disable_connected_check: false
                  ttl: 2
                  remove_all_private_as: false
                  remove_private_as: false
                  replace_private_as_with_local_as: false
                  unicast_address_family: true
                  multicast_address_family: false
                  admin_state: true
                  as_propagate: no-prepend

                - ip: 12.0.0.4
                  description: L12-C93180YC-EX-02
                  remote_as: 64800
                  local_as: 64805
                  allow_self_as: false
                  as_override: true
                  disable_peer_as_check: true
                  next_hop_self: false
                  send_community: false
                  send_ext_community: false
                  allowed_self_as_count: 3
                  bfd: false
                  disable_connected_check: false
                  ttl: 2
                  remove_all_private_as: false
                  remove_private_as: false
                  replace_private_as_with_local_as: false
                  unicast_address_family: true
                  multicast_address_family: false
                  admin_state: true
                  as_propagate: no-prepend

# Interfaces
              interface_profiles:
                - name: leaf-1101-eth7.14
                  description: L12-C93180YC-FX-01 eth1/7.14
