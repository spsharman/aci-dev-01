# L3out: Location in GUI: `Tenants` » `XXX` » `Networking` » `L3Outs`
      l3outs:

# L3out BGP to core
        - name: shared-services.vrf-01-bgp-as-64801
          description: configured with NAC
          vrf: vrf-01
          domain: shared-services.vrf-01-bgp-core
          ospf:
            area: 0.0.0.0
            area_type: regular

          export_route_map:
            name: export-subnets
            type: combinable
            contexts:
              - name: permit-172.16.10.0_24
                order: 2
                action: permit
                match_rules:
                  - match-172.16.10.0_24
              - name: permit-172.16.11.0_24
                order: 3
                action: permit
                match_rules:
                  - match-172.16.11.0_24
              - name: permit-172.16.12.0_24
                order: 4
                action: permit
                match_rules:
                  - match-172.16.12.0_24

# Nodes
          node_profiles:
            - name: border-leafs-pod-1
              nodes:
                - node_id: 1101
                  pod_id: 1
                  router_id: 110.1.1.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 110.1.1.11

                - node_id: 1102
                  pod_id: 1
                  router_id: 110.2.1.1
                  router_id_as_loopback: false
                  loopbacks:
                    - 110.2.1.11

              bgp_peers:
                - ip: 12.0.0.3
                  description: L12-C93180YC-FX-01
                  remote_as: 64800  
                  local_as: 64801
                  allow_self_as: false
                  as_override: true
                  disable_peer_as_check: true
                  next_hop_self: false
                  send_community: false
                  send_ext_community: false
                  allowed_self_as_count: 3
                  bfd: false
                  disable_connected_check: false
                  ttl: 2
                  remove_all_private_as: false
                  remove_private_as: false
                  replace_private_as_with_local_as: false
                  unicast_address_family: true
                  multicast_address_family: false
                  admin_state: true
                  as_propagate: no-prepend

                - ip: 12.0.0.4
                  description: L12-C93180YC-EX-02
                  remote_as: 64800  
                  local_as: 64801
                  allow_self_as: false
                  as_override: true
                  disable_peer_as_check: true
                  next_hop_self: false
                  send_community: false
                  send_ext_community: false
                  allowed_self_as_count: 3
                  bfd: false
                  disable_connected_check: false
                  ttl: 2
                  remove_all_private_as: false
                  remove_private_as: false
                  replace_private_as_with_local_as: false
                  unicast_address_family: true
                  multicast_address_family: false
                  admin_state: true
                  as_propagate: no-prepend

# Interfaces
              interface_profiles:
                - name: leaf-1101-eth7.10
                  description: L12-C93180YC-FX-01 eth1/7.10
                  interfaces:
                    - node_id: 1101
                      port: 7
                      vlan: 10
                      svi: false
                      ip: 10.237.96.249/31
                      mtu: inherit
                      mac: 10:12:BD:F8:19:FF
                  ospf:
                    policy: ospf_p2p

                - name: leaf-1101-eth8.10
                  description: L12-C93180YC-EX-02 eth1/8.10
                  interfaces:
                    - node_id: 1101
                      port: 8
                      vlan: 10
                      svi: false
                      ip: 10.237.96.255/31
                      mtu: inherit
                      mac: 10:12:BD:F8:19:FF
                  ospf:
                    policy: ospf_p2p

                - name: leaf-1102-eth7.10
                  description: L12-C93180YC-EX-02 eth1/7.10
                  interfaces:
                    - node_id: 1102
                      port: 7
