# Need to create route maps to expose the Isovalent subnets and map to the L3out

---
apic:

# Tenants: Location in GUI: `Tenants`
  tenants:
    - name: shared-services
      managed: true

# Policies: Location in GUI: `Tenants` » `XXX` » `Policies`
      policies:

# DHCP Relay Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocols` » `DHCP Relay`
        dhcp_relay_policies:
          - name: dhcp.uktme.cisco.com
            description: "dhcp.uktme.cisco.com"
            providers:
              - ip: 10.237.97.133
                type: external_epg
                tenant: shared-services
                # l3out: shared-services.vrf-01-ospf-area-0.0.0.1
                l3out: shared-services.vrf-01-bgp-as-64801
                external_endpoint_group: all-external-subnets

# IP SLA Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocols` » `IP SLA`
        ip_sla_policies:
          - name: icmp-aggressive-timers
            description: This policy sends a icmp ping every 1 second
            frequency: 1
            multiplier: 3
            sla_type: icmp

# Match Rules: Location in GUI: `Tenants` » `XXX` » `Policies` » `Routing` » `Match Rules`
        match_rules:
          - name: match-10.237.101.0_27
            description: matches Isovalent node subnets
            prefixes:
              - ip: 10.237.101.0/27
                aggregate: false

          - name: match-10.237.101.32_27
            description: matches Isovalent external subnets
            prefixes:
              - ip: 10.237.101.32/27
                aggregate: true
                from_length: 32
                to_length: 32

          - name: match-172.16.10.0_24
            description: matches BRKDCN-2959-DMZ subnets
            prefixes:
              - ip: 172.16.10.0/24
                aggregate: true
                to_length: 32

          - name: match-172.16.11.0_24
            description: matches BRKDCN-2959-DMZ subnets
            prefixes:
              - ip: 172.16.11.0/24
                aggregate: true
                from_length: 32
                to_length: 32

          - name: match-172.16.12.0_24
            description: matches BRKDCN-2959-DMZ subnets
            prefixes:
              - ip: 172.16.12.0/24
                aggregate: true
                to_length: 32

# OSPF Interface Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Protocols` » `OSPF Interface`
        ospf_interface_policies:
          - name: ospf_p2p
            cost: unspecified
            passive_interface: false
            mtu_ignore: false
            advertise_subnet: true
            bfd: false
            hello_interval: 10
            dead_interval: 40
            network_type: p2p
            priority: 1
            lsa_retransmit_interval: 5
            lsa_transmit_delay: 1

          - name: broadcast
            cost: unspecified
            passive_interface: false
            mtu_ignore: false
            advertise_subnet: false
            bfd: false
            hello_interval: 1
            dead_interval: 4
            network_type: bcast
            priority: 1
            lsa_retransmit_interval: 3
            lsa_transmit_delay: 1

# Route Tag Policies: Location in GUI: `Tenants` » `XXX` » `Policies` » `Routing` » `Route Tag Policies`
        route_tag_policies:
          - name: shared-services.vrf-01
            tag: 4290166600

# Services: Location in GUI: `Tenants` » `XXX` » `Services`
      services:

# L4L7 Devices: Location in GUI: `Tenants` » `XXX` » `Services` » `L4L7 Devices`
        l4l7_devices:
          - name: ftd-4112-one-arm-L3
            physical_domain: firewalls
            context_aware: single-Context
            type: PHYSICAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftd-4112-cluster
                interfaces:
                  - name: data
                    node_id: 101
                    node2_id: 102
                    channel: vpc_to_ftd-4112-cluster-data-01
            logical_interfaces:
              - name: data
                vlan: 12
                concrete_interfaces:
                  - device: ftd-4112-cluster
                    interface_name: data

          - name: ftd-4112-one-arm-L3-mpod-cluster
            physical_domain: firewalls
            context_aware: single-Context
            type: PHYSICAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftd-4112-mpod-cluster
                interfaces:
                  - name: ftd-4112-01-data-01
                    pod_id: 1
                    node_id: 1101
                    node2_id: 1102
                    channel: vpc_to_ftd-4112-01-data-01
                  - name: ftd-4112-02-data-01
                    pod_id: 2
                    node_id: 2101
                    node2_id: 2102
                    channel: vpc_to_ftd-4112-02-data-01
            logical_interfaces:
              - name: data
                vlan: 12
                concrete_interfaces:
                  - device: ftd-4112-mpod-cluster
                    interface_name: ftd-4112-01-data-01
                  - device: ftd-4112-mpod-cluster
                    interface_name: ftd-4112-02-data-01

          - name: ftd-4112-two-arm-L2
            physical_domain: firewalls
            context_aware: single-Context
            type: PHYSICAL
            function: L2
            service_type: OTHERS
            trunking: false
            concrete_devices:
              - name: ftd-4112-cluster
                interfaces:
                  - name: data-01-vlan-12-L2
                    node_id: 101
                    node2_id: 102
                    channel: vpc_to_ftd-4112-cluster-data-01
                    # vlan: 12
                  - name: data-02-vlan-13-L2
                    node_id: 101
                    node2_id: 102
                    channel: vpc_to_ftd-4112-cluster-data-02
                    # vlan: 13
            logical_interfaces:
              - name: consumer
                vlan: 12
                concrete_interfaces:
                  - device: ftd-4112-cluster
                    interface_name: data-01-vlan-12-L2
              - name: provider
                vlan: 13
                concrete_interfaces:
                  - device: ftd-4112-cluster
                    interface_name: data-02-vlan-13-L2

          - name: ftd-4112-two-arm-L3
            physical_domain: firewalls
            context_aware: single-Context
            type: PHYSICAL
            function: GoTo
            service_type: FW
            trunking: false
            concrete_devices:
              - name: ftd-4112-cluster
                interfaces:
                  - name: data-01-vlan-12
                    node_id: 101
                    node2_id: 102
                    channel: vpc_to_ftd-4112-cluster-data-01
                  - name: data-02-vlan-13
                    node_id: 101
                    node2_id: 102
                    channel: vpc_to_ftd-4112-cluster-data-02
            logical_interfaces:
              - name: consumer
                vlan: 12
                concrete_interfaces:
                  - device: ftd-4112-cluster
                    interface_name: data-01-vlan-12
              - name: provider
                vlan: 13
                concrete_interfaces:
                  - device: ftd-4112-cluster
                    interface_name: data-02-vlan-13

# Redirect Policies: Location in GUI: `Tenants` » `XXX` » `Services` » `Redirect Policies`
        redirect_policies:
          - name: ftd-4112-one-arm-L3-mpod-cluster
            anycast: true
            pod_aware: false
            l3_destinations:
              - ip: 6.6.6.242
                mac: 00:00:00:00:00:12

# Service Graph Templates: Location in GUI: `Tenants` » `XXX` » `Services` » `Service Graph Templates`
        service_graph_templates:
          - name: ftd-4112-one-arm-L3-mpod-cluster
            template_type: FW_ROUTED
            redirect: true
            share_encapsulation: false
            device:
              tenant: shared-services
              name: ftd-4112-one-arm-L3-mpod-cluster
            consumer:
              direct_connect: false
            provider:
              direct_connect: true

# Device Selection Policies: Location in GUI: `Tenants` » `XXX` » `Services` » `Device Selection Policies`
        device_selection_policies:
          - contract: any
            service_graph_template: ftd-4112-one-arm-L3-mpod-cluster
            consumer:
              redirect_policy:
                name: ftd-4112-one-arm-L3-mpod-cluster
              logical_interface: data
              bridge_domain:
                name: 6.6.6.240_28
            provider:
              redirect_policy:
                name: ftd-4112-one-arm-L3-mpod-cluster
              logical_interface: data
              bridge_domain:
                name: 6.6.6.240_28

# Filters: Location in GUI: `Tenants` » `XXX` » `Contracts` » `Filters`
      filters:
        - name: 'icmp'
          entries:
            - name: 'icmp'
              protocol: icmp

        - name: 'src-any-dst-any'
          entries:
